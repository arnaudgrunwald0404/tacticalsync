# Non-default db port: this repo is run alongside other local Supabase
# projects (e.g. cleargo binds the default 54322), so `supabase start`
# fails with "port is already allocated" unless we pick our own.
[db]
port = 54422

[auth]
site_url = "http://localhost:8089"
additional_redirect_urls = ["http://localhost:8089", "http://localhost:8080"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.external.github]
enabled = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[functions.save-google-calendar-tokens]
verify_jwt = true

[functions.google-calendar-sync]
verify_jwt = true

[functions.disconnect-google-calendar]
verify_jwt = true

[functions.exchange-zoom-token]
verify_jwt = true

[functions.zoom-recordings-sync]
verify_jwt = true

[functions.disconnect-zoom]
verify_jwt = true

[functions.exchange-slack-token]
verify_jwt = true

[functions.slack-messages-sync]
verify_jwt = true

[functions.disconnect-slack]
verify_jwt = true

# Hourly cron entrypoint — pg_cron posts with no Authorization header, same
# pattern as daily-prep-batch/extract-inbox-action-items below.
[functions.slack-sync-cron]
verify_jwt = false

[functions.daily-prep-batch]
verify_jwt = false

[functions.extract-inbox-action-items]
verify_jwt = false

[functions.agent-tick]
verify_jwt = false

[functions.query-relationship-history]
verify_jwt = true

[functions.agent-slack-action]
verify_jwt = false

# Slack slash-command handler ("/tacticalsync ..."). Public endpoint — Slack
# authenticates via the request signature, not a Supabase JWT.
[functions.slack-add-suggestion]
verify_jwt = false

[functions.generate-weekend-banner]
verify_jwt = true

[functions.send-cos-team-member-invite]
verify_jwt = true

[functions.delegate-inbox-item-to-person]
verify_jwt = true

# Scheduled RCDO staleness sweep (see rcdo-stale-check/index.ts and
# 20260729000009_rcdo_stale_check_cron.sql). Called by pg_cron with no
# Authorization header, same as agent-tick/daily-prep-batch/inbox-unsnooze-sweep.
[functions.rcdo-stale-check]
verify_jwt = false

# Soundbites audio-streaming proxy (PLAN_idea10 §B3). A native <audio>/<video>
# element can't attach a custom Authorization header, so the gateway-level JWT
# check can't run here — auth happens inside the function against a JWT
# passed via an access_token query param instead. See zoom-media-proxy/index.ts.
[functions.zoom-media-proxy]
verify_jwt = false