name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_LOCAL_ANON_KEY || 'ci-local-anon-key' }}

      - name: Generate coverage report
        run: npm run test:coverage -- --run
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_LOCAL_ANON_KEY || 'ci-local-anon-key' }}
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  # NOTE: this whole job is disabled (`if: false`) and has been since it was
  # added — e2e tests do not run in CI today, only Vitest (unit-tests, above).
  # That's a pre-existing decision this PR does not change; the mobile step
  # below is kept wired up consistently with the desktop step so that if/when
  # this job is re-enabled, mobile coverage comes along with it rather than
  # needing to be rediscovered later.
  e2e-tests:
    name: E2E Tests
    if: false
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_LOCAL_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_LOCAL_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Run E2E tests (desktop)
        run: npx playwright test --project=chromium --project=firefox --project=webkit

      - name: Run E2E tests (mobile)
        run: npm run test:e2e:mobile

      - name: Stop Supabase
        if: always()
        run: supabase stop

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  # Runs independently of the (disabled) e2e-tests job above: this is the
  # merge-blocking live-RLS check for relationship-memory privacy (Idea #7).
  # personMemoryRls.test.ts (unit-tests job) only checks that migration SQL
  # *declares* auth.uid() = user_id scoping — only a real Postgres instance
  # can confirm RLS actually *enforces* it, which is what this job verifies.
  person-memory-privacy:
    name: Person Memory Privacy (RLS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      # Uses e2e/setup/localSupabaseDefaults.ts's well-known local anon/service
      # keys — no secrets needed; this test never leaves the CI runner.
      - name: Run person memory privacy spec
        run: npx playwright test e2e/inbox/personMemoryPrivacy.spec.ts --project=chromium

      - name: Stop Supabase
        if: always()
        run: supabase stop

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: person-memory-privacy-report
          path: playwright-report/
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Catches duplicate / out-of-order migration timestamps before they
      # merge to main and break `npm run dev` (predev runs db:validate).
      - name: Validate migrations
        run: npm run db:validate
